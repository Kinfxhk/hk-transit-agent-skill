schema_version: "0.1"
layer: community
unofficial: true
duration_policy_global: official_eta_or_gtfs_only

tips:
  - id: tip-mode-ael-vs-airport-bus
    title: "Airport Express vs airport bus — compare both"
    title_zh: "機場快線 vs 機場巴——兩邊都要比"
    category: mode_choice
    audience: [tourist, both]
    summary: "For airport↔city, consider both Airport Express and airport buses. Never assume one is always faster; Skill must pull both official ETA/timetables and label sources."
    summary_zh: "機場往返市區：同時考慮機場快線同機場巴士。唔好預設邊種一定快；Skill 必須兩邊拉官方 ETA／時間表再比，並標來源。"
    community: true
    unofficial: true
    source: "https://www.mtr.com.hk/en/customer/services/airport_express_index.html"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "No single official AEL-vs-bus speed comparison page found; verify each candidate with Next Train + KMB/LWB/Citybus ETA or GTFS."
    risk: low
    disclaimer: "Community preference tip AS IS. Not official journey time. Durations from official ETA/GTFS only."
    related_sources:
      - "https://data.gov.hk/en-data/dataset/mtr-data2-nexttrain-data"
      - "https://data.gov.hk/en-data/dataset/hk-td-tis_21-etakmb"
      - "https://data.gov.hk/en-data/dataset/ctb-eta-transport-realtime-eta"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-exit-walk-pedroute
    title: "Verify exits and walks with official maps / PedRoute"
    title_zh: "出口同步行用官方站圖／PedRoute 覆核"
    category: interchange
    audience: [both]
    summary: "Station exits and transfer walks: verify with official station layouts or LandsD PedRoute / OSRM walk. Process tip only — no hardcoded exits or minutes."
    summary_zh: "站出口／轉乘步行：用官方站設施圖或 LandsD PedRoute／OSRM walk 覆核；只提醒流程，唔寫死出口或分鐘。"
    community: true
    unofficial: true
    source: "https://hosting.csdi.gov.hk/csdi-webpage/apidoc/3d-pedestrian-route-search"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Per-station exit numbers must come from MTR station layout PDFs or PedRoute response at query time."
    risk: medium
    disclaimer: "Community process tip AS IS; shortcuts may close. Not official ETA."
    related_sources:
      - "https://www.mtr.com.hk/en/customer/services/system_map.html"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-gmb-vs-mtr
    title: "Green minibus has official ETA; red van does not"
    title_zh: "綠巴有官方 ETA；紅van 無"
    category: mode_choice
    audience: [local, both]
    summary: "Green minibuses have fixed routes and official realtime ETA; MTR has Next Train. Both can be candidates; durations from each official ETA. Red minibuses lack citywide official realtime — do not treat like GMB."
    summary_zh: "綠專線小巴有固定路線同官方實時到站；港鐵有 Next Train。兩者可並列，車程跟各自官方 ETA。紅van 無全市官方實時——唔好當綠巴用。"
    community: true
    unofficial: true
    source: "https://www.td.gov.hk/tc/transport_in_hong_kong/public_transport/minibuses/index.html"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Resolve GMB/MTR candidates via GTFS + data.etagmb.gov.hk / Next Train at query time."
    risk: low
    disclaimer: "Community mode-choice tip AS IS. Not official journey time."
    related_sources:
      - "https://data.gov.hk/en-data/dataset/hk-td-sm_7-real-time-arrival-data-of-gmb"
      - "https://data.gov.hk/en-data/dataset/mtr-data2-nexttrain-data"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-cross-harbour-preference
    title: "Cross-harbour: bus or MTR by preference axes"
    title_zh: "過海：巴士或港鐵——跟偏好維度"
    category: mode_choice
    audience: [local, both]
    summary: "Cross-harbour bus and MTR are both valid. Prefer by fewer transfers / seats / luggage / late night; actual duration from live official ETA or GTFS only."
    summary_zh: "過海巴士同港鐵都係合法候選。可按少轉／座位／行李／夜班偏好；實際車程只跟官方 ETA 或 GTFS。"
    community: true
    unofficial: true
    source: "https://data.gov.hk/en-data/dataset/hk-td-tis_11-pt-headway-en"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Compare live KMB/Citybus ETA and MTR Next Train for the OD; never hardcode which is faster."
    risk: low
    disclaimer: "Community preference tip AS IS. Not official journey time."
    related_sources:
      - "https://data.gov.hk/en-data/dataset/hk-td-tis_21-etakmb"
      - "https://data.gov.hk/en-data/dataset/ctb-eta-transport-realtime-eta"
      - "https://data.gov.hk/en-data/dataset/mtr-data2-nexttrain-data"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-last-train-check
    title: "Last train — verify with GTFS / operator, never hardcode"
    title_zh: "尾班車——跟 GTFS／營辦覆核，唔硬編碼"
    category: other
    audience: [both]
    summary: "Late night / last train: verify with TD GTFS and/or operator timetable / Next Train for that day and station. Never hardcode last-train clock times in tips."
    summary_zh: "夜歸／尾班：用 TD GTFS 同／或營辦時間表／Next Train 覆核該日該站；禁止喺 tip 硬編碼尾班鐘點。"
    community: true
    unofficial: true
    source: "https://data.gov.hk/en-data/dataset/hk-td-tis_11-pt-headway-en"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Last departure must be read from current GTFS calendar/stop_times or operator timetable at query time."
    risk: high
    disclaimer: "Community process tip AS IS. Missing last train can strand you — verify official sources."
    related_sources:
      - "https://data.gov.hk/en-data/dataset/mtr-data2-nexttrain-data"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-ferry-tourist
    title: "Ferries: HKKF/Sun Ferry ETA; Star Ferry static only"
    title_zh: "渡輪：HKKF／新渡輪有 ETA；天星只靜態"
    category: tourist_default
    audience: [tourist, both]
    summary: "HKKF and Sun Ferry publish DATA.GOV.HK ETA — use those for timing. Star Ferry publishes timetable/fare static data only (no equivalent realtime ETA dataset found this round) — label static, never live ETA."
    summary_zh: "HKKF／Sun Ferry 有 DATA.GOV.HK ETA——車程跟 ETA。天星只有時間表／車費靜態（今輪未見同等實時 ETA）——標靜態，唔扮實時。"
    community: true
    unofficial: true
    source: "https://data.gov.hk/en-data/dataset/hkkf-hkkfdata-hkkf-eta-data"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Pick ferry operator dataset per route; Star Ferry = static timetable only."
    risk: low
    disclaimer: "Community ferry guidance AS IS. Not official journey time."
    related_sources:
      - "https://data.gov.hk/en-data/dataset/sunferry-eta-eta"
      - "https://data.gov.hk/en-data/dataset/starferry-starferry-ferry-service-timetables-and-fare-tables-of-star-ferry"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-alias-ifc-hk-station
    title: "IFC landmark → Hong Kong Station (resolve official stop)"
    title_zh: "IFC 地標 → 香港站（仍要對官方站名）"
    category: tourist_default
    audience: [tourist, both]
    summary: "ifc mall states it sits atop Hong Kong MTR Station and lists Exit F / E1 access. Treat IFC as a landmark alias — still resolve to official stop name/id; do not invent stop ids."
    summary_zh: "ifc 官網寫明坐落港鐵香港站之上，並列 Exit F／E1。IFC 只當地標別名——仍要對齊官方站名／stop id，唔發明 id。"
    community: true
    unofficial: true
    source: "https://ifc.com.hk/en/mall/location/"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Alias only. Confirm Hong Kong Station stop id via TD GTFS / MTR; exit letters may change — re-check ifc + MTR layout."
    risk: medium
    disclaimer: "Community landmark alias AS IS. Exit letters from mall site — verify on site / MTR layout. Not official stop id."
    related_sources:
      - "https://www.mtr.com.hk/en/customer/services/aestations_hk.html"
      - "https://www.mtr.com.hk/en/customer/services/system_map.html"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-red-van-convention-only
    title: "Red van — convention tip only, never realtime ETA"
    title_zh: "紅van——只慣例 tip，唔當實時 ETA"
    category: rmb_habit
    audience: [local]
    summary: "TD: red (non-scheduled) minibuses need not have routes/headways/fares TD-approved; no citywide official realtime ETA. Community boarding-point tips only; never invent schedules."
    summary_zh: "運輸署：紅van 路線／班次／收費毋須審批；無全市官方實時到站。只可作上車點／慣例社群 tip；永遠唔發明班次。"
    community: true
    unofficial: true
    source: "https://www.td.gov.hk/tc/transport_in_hong_kong/public_transport/minibuses/index.html"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Permanent gap for citywide red-van ETA; any specific habit line needs its own sourced tip."
    risk: high
    disclaimer: "Community habit tip AS IS; service may vanish. Not official ETA or schedule."
    duration_policy: official_eta_or_gtfs_only

  - id: tip-estate-shuttle-template
    title: "Estate/mall shuttle — user timetable template only"
    title_zh: "屋苑／商場接駁——只收用戶時間表模板"
    category: estate_shuttle
    audience: [local, both]
    summary: "TD public-transport catalogue separates franchised buses from other modes; estate/mall free shuttles have no citywide official open ETA. Accept only user/estate timetable fields (route, operator, validity, source URL). Never invent schedules."
    summary_zh: "運輸署公共交通分類有專營巴等同其他模式；屋苑／商場免費接駁無全市官方公開 ETA。只收用戶／屋苑時間表欄位；Skill 唔發明班次。"
    community: true
    unofficial: true
    source: "https://www.td.gov.hk/en/transport_in_hong_kong/public_transport/index.html"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Template only until a specific estate publishes a citable timetable URL."
    risk: high
    disclaimer: "Template tip AS IS. No schedule invented. Not official ETA."
    duration_policy: official_eta_or_gtfs_only

  - id: tip-motion-comfort
    title: "Motion comfort = preference, not medical advice"
    title_zh: "易暈偏好＝偏好，非醫囑"
    category: other
    audience: [both]
    summary: "Prefer fewer sharp turns / rail or steadier seating when user asks. Label non-medical / AS IS. No guarantee against motion sickness; durations still from official ETA."
    summary_zh: "用戶要求易暈時可啟發式偏好較少急彎／鐵路或較穩座位；標非醫囑／AS IS。唔保證唔暈；車程仍跟官方 ETA。"
    community: true
    unofficial: true
    source: "https://github.com/Kinfxhk/hk-transit-agent-skill/blob/main/README.md"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Product policy tip (README Disclaimer / SKILL motion-comfort). No official comfort API."
    risk: high
    disclaimer: "Not medical advice. Heuristic preference only. AS IS."
    related_sources:
      - "https://github.com/Kinfxhk/hk-transit-agent-skill/blob/main/SKILL.md"
    duration_policy: official_eta_or_gtfs_only

  - id: tip-verify-hkemobility
    title: "Verify with official HKeMobility"
    title_zh: "用官方「香港出行易」核對"
    category: other
    audience: [both]
    summary: "Advise verifying realtime arrivals, fares and diversions with TD HKeMobility. Skill output is assistive — official app/operators prevail."
    summary_zh: "建議用運輸署 HKeMobility 核對實時到站、車費同改道；本 Skill 輸出係輔助，以官方 App／營辦為準。"
    community: true
    unofficial: true
    source: "https://www.td.gov.hk/en/public_services/hong_kong_emobility/"
    as_of: "2026-10-21"
    expires: null
