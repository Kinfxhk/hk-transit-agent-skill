  - id: tip-fare-octopus-disclaimer
    title: "Fares — operator prevails; GTFS is estimate"
    title_zh: "車資以營辦為準；GTFS 只估算"
    category: fare_hint
    audience: [both]
    summary: "Fares / Octopus concessions follow operator same-day publication. TD GTFS fare files are estimates only. Always label estimate/AS IS."
    summary_zh: "車資／八達通優惠以營辦當日公布為準；TD GTFS fare 只可估算。必須標估算／AS IS。"
    community: true
    unofficial: true
    source: "https://data.gov.hk/en-data/dataset/hk-td-tis_11-pt-headway-en"
    as_of: "2026-10-21"
    expires: null
    route_check:
      status: unverified
      official_route_ids: []
      official_stop_ids: []
      note: "Fare figures from GTFS must be labelled estimate; confirm with operator or HKeMobility."
    risk: medium
    disclaimer: "Fare estimate AS IS. Not a fare guarantee."
    related_sources:
      - "https://data.gov.hk/en/terms-and-conditions"
    duration_policy: official_eta_or_gtfs_only
